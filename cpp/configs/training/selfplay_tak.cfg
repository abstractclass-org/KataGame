# Tak's self-play (the engine repository's games/tak/docs/design/08-levers.md, each value with its reason there):
# KataGo's selfplay1.cfg, with the values that Tak needs: its two boards (5 x 5 and 6 x 6, 3 to 7 by new games), the
# komi of each size with KataGo's three kinds of draws on Tak's scale, no score utility and no even komi (a road wins
# at every komi), a draw as its own result, the rows' bytes and the cache of its 9,181-slot policy. Each line that
# differs from selfplay1.cfg says why. The run's own settings (RGSC's buffer, AZdb's members, the inputs version's
# trainer) are in its settings file, games/tak/runs/RUN.env.
#   katago selfplay -config configs/training/selfplay_tak.cfg -models-dir MODELS -output-dir OUT

# Logs----------------------------------------------------------------------------------

logSearchInfo = false
logMoves = false
logGamesEvery = 10
logToStdout = true

# Data writing-----------------------------------------------------------------------------------

dataBoardLen = 6  # Tak: the network's board, its largest. A 5 x 5 game is masked in it, as KataGo's smaller boards are
maxDataQueueSize = 2000
maxRowsPerTrainFile = 800  # Tak: about the bytes of selfplay1.cfg's 10,000 rows of Go (7,675 bytes): a row of Tak's inputs version 14 is 95,301 bytes (games.row_bytes), with the Q values and the legal moves
firstFileRandMinProp = 0.15
inputsVersion = 14  # Tak: AZdb's latent, 5 global inputs (design 05). Tak's planes are all base planes, so versions 10 to 13 add nothing. The trainer takes -inputs-version 14 (RUN.env)

# Fancy game selfplay settings--------------------------------------------------------------------
earlyForkGameProb = 0.04  # Fork to try alternative opening variety with this probability
earlyForkGameExpectedMoveProp = 0.025  # KataGo's: the fork scales it by game length (GAME_LENGTH_AREA, 361 x 57 / 328 = 62.7 for GAME_LENGTH's 57 plies, assumed until the pilot), about 1.6 plies
forkGameProb = 0.01 # Fork to try alternative crazy move anywhere in game with this probability if not early forking
forkGameMinChoices = 3   # Choose from the best of at least this many random choices
earlyForkGameMaxChoices = 12  # Choose from the best of at most this many random choices
forkGameMaxChoices = 36  # Choose from the best of at most this many random choices
sekiForkHackProb = 0.0  # Tak: no seki (Go only)
initGamesWithPolicy = true  # Play the first few moves of a game high-temperaturely from policy
policyInitAreaProp = 0.04  # KataGo's: scaled by GAME_LENGTH_AREA as the forks, about 2.5 plies from the policy
compensateAfterPolicyInitProb = 0.0  # Tak: no even komi. A position bound for a road has none, and the product plays the variants' komis (08-levers.md, group 1)
sidePositionProb = 0.020  # With this probability, train on refuting bad alternative moves.

cheapSearchProb = 0.75  # Do cheap searches with this probaiblity
cheapSearchVisits = 100  # KataGo's 600/100 for very early training (configs/training/README.md), then KataGo's steps
cheapSearchTargetWeight = 0.0  # Training weight for cheap search
cheapSearchPerMove = false  # Tak: off, it cannot apply. A move is one action and one turn, so either setting gives KataGo's draws
cheapSearchPerTurn = false  # Tak: off, as cheapSearchPerMove

reduceVisits = true  # Reduce visits when one side is winning
reduceVisitsThreshold = 0.9  # How winning a side needs to be (winrate)
reduceVisitsThresholdLookback = 3  # How many consecutive turns needed to be that winning
reducedVisitsMin = 100  # Minimum number of visits (never reduce below this)
reducedVisitsWeight = 0.1  # Minimum training weight

handicapAsymmetricPlayoutProb = 0.0  # Tak: no handicap games (handicapProb below)
normalAsymmetricPlayoutProb = 0.01  # In regular games, play with unbalanced players with this probability
maxAsymmetricRatio = 8.0 # Max ratio to unbalance visits between players
minAsymmetricCompensateKomiProb = 0.0  # Tak: no even komi (compensateAfterPolicyInitProb)

policySurpriseDataWeight = 0.5  # This proportion of training weight should be concentrated on surprising moves
valueSurpriseDataWeight = 0.1   # This proportion of training weight should be concentrated on surprising position results

estimateLeadProb = 0.0  # Tak: no lead target. A road wins at every komi, so the lead's even komi often does not exist (06-heads-and-results.md)
switchNetsMidGame = true  # When a new neural net is loaded, switch to it immediately instead of waiting for new game
fancyKomiVarying = false  # Tak: off. Its spreads read the board's side in Go's points, 0.75 x 6 = 4.5 and 1.5 x 6 = 9 flats on 6 x 6, 1.5 and 3 times the median flat margin, and it searches for an even komi, which Tak does not use. The big and bigger draws below give the unfair komis on Tak's scale

# Match-----------------------------------------------------------------------------------

numGameThreads = 128  # KataGo's until the benchmark (abscls-shfz.13) sets it with nnMaxBatchSize and the server threads
maxMovesPerGame = 1600  # KataGo's, as a guard: Tak's games end by the rules, and a game at the cap is missing data, with no targets that read its end (02-rules.md)

# Rules------------------------------------------------------------------------------------

koRules = SIMPLE  # Tak: no ko, one value. Tak's rules are playtak's, with the swap opening and the 50-ply draw (02-rules.md)
scoringRules = AREA  # Tak: its own count of the flats, one value
taxRules = NONE  # Tak: Go only
multiStoneSuicideLegals = false  # Tak: Go only
hasButtons = false  # Tak: Go only

bSizes = 5,6  # Tak: the product's two sizes. 6 x 6 is the competitive game, and 5 x 5 the most played (04-board-sizes-and-komi.md)
bSizeRelProbs = 3,7  # Tak: 30% of the new games on 5 x 5, about a quarter of the rows (its games are shorter). KataGo also weights its largest size most (35 of 100 on 19 x 19)

# The komi K: flats added to Black's count (the second player's), on the half-flat grid. Each size's draw, as
# 04-board-sizes-and-komi.md gives it: a mean, a spread around it, and two wider spreads for unfair games.
# - The means: the product's komis. 5 x 5 at 0, as nearly every game that people play. 6 x 6 at 0 and 2, half each, the
#   two komis of the product (2 is the engines' and the tournaments' komi).
# - The spread: 1 flat, two steps of the half-flat grid, as selfplay1.cfg's 1 point is two steps of Go's half-point
#   grid. It reaches 2.5 and 3, the values between the standards, so the network learns komi as a quantity.
# - The big and the bigger draws: 11% of each size's new games are unfair by design, as about 11% of selfplay1.cfg's
#   (its big draws, and its handicap games that keep their komi). Each key below gives its reason, and
#   04-board-sizes-and-komi.md, "The values", the derivation and the draws' shares.
# A fork draws around its parent's komi with the same spreads.
komiAuto = false  # Tak: the means are the variants' own komis, not a fair komi
komiMeans5 = 0
komiMeans6 = 0,2
komiMeanRelProbs6 = 1,1
komiStdev = 1.0  # Tak: in flats on every size (KOMI_AREA 361, gameencoding.h), two grid steps
komiBigStdevProb = 0.0631578947  # Tak: 6% of new games, 0.06 / 0.95, since the bigger draw overrides this one
komiBigStdev = 1.875  # Tak: selfplay1.cfg's 12 points x SCORE_SCALE. A new SCORE_SCALE changes it
komiBiggerStdevProb = 0.05  # Tak: 5% of new games, in place of selfplay1.cfg's handicap games that keep their komi (handicapProb 0.10 x (1 - handicapCompensateKomiProb 0.50)): Tak has no handicap stones
komiBiggerStdev = 5.0  # Tak: the sampler truncates at 3 of it, the komi's range, +-15 flats ((36 + 60) x SCORE_SCALE), beyond 99% of the flat margins. It reaches playtak's komi as a handicap (up to 4 flats) and flat counts out of one side's reach
komiAllowIntegerProb = 1.0  # Tak: whole and half flats. A flat margin is whole flats, and a whole komi such as 2 keeps the flat tie, a draw
handicapProb = 0.0  # Tak: no handicap stones. The bigger draws above give its unfair games
handicapCompensateKomiProb = 0.0  # Tak: no handicap
forkCompensateKomiProb = 0.0  # Tak: no even komi (compensateAfterPolicyInitProb)
sgfCompensateKomiProb = 0.0  # Tak: no even komi, and no starts from records

drawRandRadius = 0.0  # Tak: no score draw. A draw is its own result (the no result), half a win (06-heads-and-results.md)
noResultStdev = 0.0  # Tak: the no result's utility is 0 in every game. selfplay1.cfg draws it around 0 for each game, and no input shows it

# Search limits-----------------------------------------------------------------------------------

maxVisits = 600  # KataGo's 600/100 for very early training (configs/training/README.md), then KataGo's steps
numSearchThreads = 1

# GPU Settings-------------------------------------------------------------------------------

nnMaxBatchSize = 128  # KataGo's until the benchmark (abscls-shfz.13)
nnCacheSizePowerOfTwo = 15  # Tak: an output holds 9,181 policy values (37 KB), so 2^15 is about 1.2 GB, as Enclosure's 2^15 (selfplay1.cfg's 2^21 would be about 77 GB)
nnMutexPoolSizePowerOfTwo = 15
numNNServerThreadsPerModel = 1  # KataGo's until the benchmark (abscls-shfz.13)
nnRandomize = true

cudaUseFP16 = auto
cudaUseNHWC = auto

# Root move selection and biases------------------------------------------------------------------------------

chosenMoveTemperatureEarly = 0.75
chosenMoveTemperatureHalflife = 19  # KataGo's: the front scales it by game length, sqrt(GAME_LENGTH_AREA), about 7.9 plies
chosenMoveTemperature = 0.15
chosenMoveSubtract = 0
chosenMovePrune = 1

rootNoiseEnabled = true
rootDirichletNoiseTotalConcentration = 10.83  # KataGo's total, so each move gets about 10.83 / 96 = 0.11 on 6 x 6's opening (AlphaZero scaled the alpha inversely to the legal moves)
rootDirichletNoiseWeight = 0.25

rootDesiredPerChildVisitsCoeff = 2
rootNumSymmetriesToSample = 4  # KataGo's: 4 of Tak's 8 symmetries of the square, as 4 of Go's 8

useLcbForSelection = true
lcbStdevs = 5.0
minVisitPropForLCB = 0.15

# Internal params------------------------------------------------------------------------------

winLossUtilityFactor = 1.0
staticScoreUtilityFactor = 0.00
dynamicScoreUtilityFactor = 0.00  # Tak: no score utility. The score exists on flat endings only, and a utility of more flats would trade road chances for them (08-levers.md, group 4)
dynamicScoreCenterZeroWeight = 0.25
dynamicScoreCenterScale = 0.50
noResultUtilityForWhite = 0.0  # A draw, Tak's no result: half a win
drawEquivalentWinsForWhite = 0.5

rootEndingBonusPoints = 0.5  # Go's pass ending: no effect in Tak (KataGame's GAMES.md, "Go's features, kept neutral")
rootPruneUselessMoves = true  # As rootEndingBonusPoints

rootPolicyTemperatureEarly = 1.25
rootPolicyTemperature = 1.1

cpuctExploration = 1.1
cpuctExplorationLog = 0.0
fpuReductionMax = 0.2
rootFpuReductionMax = 0.0
numVirtualLossesPerThread = 1

valueWeightExponent = 0.5
subtreeValueBiasFactor = 0.30  # KataGo's, with Tak's local hash (its top pieces by owner and kind, and the stacks of more than one piece) in KataGo's window of 5 (10-katagame-additions.md, "The local hash")
subtreeValueBiasWeightExponent = 0.8

useNonBuggyLcb = true
useGraphSearch = true

fpuParentWeightByVisitedPolicy = true
fpuParentWeightByVisitedPolicyPow = 2.0

# RGSC------------------------------------------------------------------------------------------
# Tak: off unless a run turns it on (rgscEnabled and rgscBufferFile in the run's folder, then rgscStartProb), in the
# steps of 10-katagame-additions.md, "RGSC for Tak". The buffer keeps exact states (state_text), with their size and
# komi.
rgscEnabled = false
rgscBufferSize = 100      # the paper's setting from scratch (A.1)
rgscStartProb = 0.0       # first the regret heads train and no game restarts; then 0.25 (the run's settings)
rgscTemperature = 0.1     # tau: P(i) = R_i^(1/tau) / sum
rgscEmaAlpha = 0.5        # alpha: a restarted state's regret becomes (1 - alpha) old + alpha new
rgscWarmupGames = 0       # the paper's 1,000 games are for a trained network, and Tak's run starts from scratch
rgscSwingScale = 0        # Tak: the swing source is parked. It has not been useful in the other games, so no swing targets
rgscSwingStartProb = 0.0  # Tak: no restarts from a swing buffer

# Starts from people's positions---------------------------------------------------------------
# Off: no key here. Tak's training is self-play only, and playtak's games are for measuring only (01-port-plan.md, open
# decision 2).
