# Blueprints' self-play (the engine repository's games/blueprints/README.md): Connect-4's selfplay_connect4.cfg
# (KataGo's selfplay1.cfg with komi 0 without randomization), with the values that Blueprints needs: selfplay1.cfg's
# 600 visits (100 in a cheap search), its view of 67 x 67 on a rules board of 255 x 255, its moves (a game is 120 of
# the site's moves, about 180 actions with the edits' picks), its symmetries, a cache that fits its policy, and a komi
# for a quarter of the games (the README's "Komi"). Each line that differs from selfplay1.cfg says why. The values'
# history is in the engine repository's games/blueprints/docs/decisions/port.md.
#   katago selfplay -config configs/training/selfplay_blueprints.cfg -models-dir MODELS -output-dir OUT

# Logs----------------------------------------------------------------------------------

logSearchInfo = false
logMoves = false
logGamesEvery = 10
logToStdout = true

# Data writing-----------------------------------------------------------------------------------

dataBoardLen = 67  # Blueprints: the network's board, the view of 67 x 67 around the mover's window (gamerules.h)
maxDataQueueSize = 2000
maxRowsPerTrainFile = 10000
firstFileRandMinProp = 0.15

# Fancy game selfplay settings--------------------------------------------------------------------
earlyForkGameProb = 0.04  # Fork to try alternative opening variety with this probability
earlyForkGameExpectedMoveProp = 0.025  # KataGo's: the fork scales it by game length (Board::GAME_LENGTH_AREA, 132), about 3.3 actions
forkGameProb = 0.01 # Fork to try alternative crazy move anywhere in game with this probability if not early forking
forkGameMinChoices = 3   # Choose from the best of at least this many random choices
earlyForkGameMaxChoices = 12  # Choose from the best of at most this many random choices
forkGameMaxChoices = 36  # Choose from the best of at most this many random choices
sekiForkHackProb = 0.0  # Blueprints: no seki
initGamesWithPolicy = true  # Play the first few moves of a game high-temperaturely from policy
policyInitAreaProp = 0.04  # KataGo's: the fork scales it by game length (Board::GAME_LENGTH_AREA, 132), about 5.3 actions from the policy
compensateAfterPolicyInitProb = 0.0  # Blueprints: no komi compensation until a held-out sweep of komi shows the win rate falling as the komi rises
sidePositionProb = 0.020  # With this probability, train on refuting bad alternative moves.

cheapSearchProb = 0.75  # Do cheap searches with this probaiblity
cheapSearchVisits = 100  # Blueprints: 600/100 visits, KataGo's early-training config (selfplay1.cfg)
cheapSearchTargetWeight = 0.0  # Training weight for cheap search

reduceVisits = true  # Reduce visits when one side is winning
reduceVisitsThreshold = 0.9  # How winning a side needs to be (winrate)
reduceVisitsThresholdLookback = 3  # How many consecutive turns needed to be that winning
reducedVisitsMin = 100  # Minimum number of visits (never reduce below this)
reducedVisitsWeight = 0.1  # Minimum training weight

handicapAsymmetricPlayoutProb = 0.0  # Blueprints: no handicap games
normalAsymmetricPlayoutProb = 0.01  # In regular games, play with unbalanced players with this probability
maxAsymmetricRatio = 8.0 # Max ratio to unbalance visits between players
minAsymmetricCompensateKomiProb = 0.0  # Blueprints: no komi compensation yet (compensateAfterPolicyInitProb)

policySurpriseDataWeight = 0.5  # This proportion of training weight should be concentrated on surprising moves
valueSurpriseDataWeight = 0.1   # This proportion of training weight should be concentrated on surprising position results

estimateLeadProb = 0.0  # Blueprints: no lead target yet. The lead's search varies komi, so it needs the win rate's response to komi first (compensateAfterPolicyInitProb)
switchNetsMidGame = true  # When a new neural net is loaded, switch to it immediately instead of waiting for new game
fancyKomiVarying = false  # Blueprints: off. Its spreads (play.cpp) read the board's area: 0.75 and 1.5 x 67 points, Go's spreads on this view

# Match-----------------------------------------------------------------------------------

numGameThreads = 128
maxMovesPerGame = 1600

# Rules------------------------------------------------------------------------------------

koRules = SIMPLE  # Blueprints: no ko, one value
scoringRules = AREA  # Blueprints: its own score, one value
taxRules = NONE  # Blueprints: Go only
multiStoneSuicideLegals = false  # Blueprints: Go only
hasButtons = false  # Blueprints: Go only

bSizesXY = 67-67  # Blueprints: its one view
bSizeRelProbs = 1  # Blueprints: its one board

komiMean = 0.0  # Blueprints: the real game's komi. The komi K is points added to the second player's final margin
komiStdev = 0.0  # Blueprints: 75% of games at exactly 0, the real game (the two draws below override this one)
komiBigStdevProb = 0.2105263158  # Blueprints: 20% of games, 0.20 / 0.95, since the bigger draw overrides this one
komiBigStdev = 250.0  # Blueprints: about half the median margin of the site's games (523 points); each draw is truncated at 3 standard deviations
komiBiggerStdevProb = 0.05  # Blueprints: 5% of games
komiBiggerStdev = 1000.0  # Blueprints: handicaps of the order of the 90th percentile of the site's margins (2,101 points), out to +-3,000
komiAllowIntegerProb = 1.0  # Blueprints: whole and half points, so that komi 0 stays 0 (each draw rounds at random to half points)
handicapProb = 0.0  # Blueprints: no handicap
handicapCompensateKomiProb = 0.0  # Blueprints: no komi compensation yet (compensateAfterPolicyInitProb)
forkCompensateKomiProb = 0.0  # Blueprints: no komi compensation yet (compensateAfterPolicyInitProb)
sgfCompensateKomiProb = 0.0  # Blueprints: no komi compensation yet (compensateAfterPolicyInitProb)

drawRandRadius = 0.0  # Blueprints: equal scores draw, and a draw counts as half a win in every game, since the inputs do not encode its value
noResultStdev = 0.166666666

# Search limits-----------------------------------------------------------------------------------

maxVisits = 600  # Blueprints: 600/100 visits, KataGo's early-training config (selfplay1.cfg)
numSearchThreads = 1

# GPU Settings-------------------------------------------------------------------------------

nnMaxBatchSize = 128
nnCacheSizePowerOfTwo = 14  # Blueprints: an output holds 26,935 policy values (108 KB), so 2^14 is about 1.8 GB, as Enclosure's 2^15
nnMutexPoolSizePowerOfTwo = 15
numNNServerThreadsPerModel = 1
nnRandomize = true

cudaUseFP16 = auto
cudaUseNHWC = auto

# Root move selection and biases------------------------------------------------------------------------------

chosenMoveTemperatureEarly = 0.75
chosenMoveTemperatureHalflife = 19
chosenMoveTemperature = 0.15
chosenMoveSubtract = 0
chosenMovePrune = 1

rootNoiseEnabled = true
rootDirichletNoiseTotalConcentration = 10.83
rootDirichletNoiseWeight = 0.25

rootDesiredPerChildVisitsCoeff = 2
rootNumSymmetriesToSample = 4  # Blueprints: all 4 of its symmetries (gameencoding.h; selfplay1.cfg: 4 of Go's 8)

useLcbForSelection = true
lcbStdevs = 5.0
minVisitPropForLCB = 0.15

# Internal params------------------------------------------------------------------------------

winLossUtilityFactor = 1.0
staticScoreUtilityFactor = 0.00
dynamicScoreUtilityFactor = 0.40
dynamicScoreCenterZeroWeight = 0.25
dynamicScoreCenterScale = 0.50
noResultUtilityForWhite = 0.0
drawEquivalentWinsForWhite = 0.5

rootEndingBonusPoints = 0.5
rootPruneUselessMoves = true

rootPolicyTemperatureEarly = 1.25
rootPolicyTemperature = 1.1

cpuctExploration = 1.1
cpuctExplorationLog = 0.0
fpuReductionMax = 0.2
rootFpuReductionMax = 0.0
numVirtualLossesPerThread = 1

valueWeightExponent = 0.5
subtreeValueBiasFactor = 0.30
subtreeValueBiasWeightExponent = 0.8

useNonBuggyLcb = true
useGraphSearch = true

fpuParentWeightByVisitedPolicy = true
fpuParentWeightByVisitedPolicyPow = 2.0
