# Blueprints: the settings of play through KataGo's GTP engine under a clock, such as strategyjam.org's: the native
# practice engine (katago blueprints-practice, the engine repository's games/blueprints/README.md, "The practice bot")
# and `katago gtp`. They are Blueprints' analysis settings (analysis_blueprints.cfg: no root noise, the search of the
# root's views), with the keys of play through GTP below. A key below wins over the included file's.
@include analysis_blueprints.cfg

# GTP's logs, beside the included file's analysis_logs: each command, its response and each search
# (logSearchInfo: the root's visits, the new playouts and the evaluator's rows, so the log shows the tree kept from
# move to move and the pondering between moves). A controller can set logDir with -override-config.
logDir = gtp_logs
logAllGTPCommunication = true
logSearchInfo = true
logToStderr = false

# GTP needs a rules key, and the analysis settings have none. The rules' komi is 0, and `komi` changes it.
rules = tromp-taylor

# GTP's search threads. The practice engine sets them from blueprints-start SEED THREADS.
numSearchThreads = 1

# No cap of visits: the clock ends each search (kata-time_settings, time_left). The included file's 500 visits are
# the browser's practice page's. 2^50 is the largest value of KataGo's config reader, its "no limit". A controller
# that gives no clock must set maxVisits or maxTime.
maxVisits = 1125899906842624

# The engine searches between its moves: the position after its own move, the rule's view (GTP's pondering with the
# root's views: a genmove of the usual search keeps the tree, and a genmove of the root's views stops it). It does not
# ponder a finished game (search/asyncbot.cpp).
ponderingEnabled = true
# The longest pondering after each move, KataGo's value in gtp_example.cfg (and gtp_enclosure.cfg's): an engine that
# its controller leaves waiting does not hold the CPU or the GPU, and its tree does not grow, with no end. A move of
# the other seat starts it again.
maxTimePondering = 60.0

# The seconds that the clock keeps for the time outside the search: from the time_left that the engine gets to the
# site's clock stop at our move (the search's start and end, the way of the state to the client, and the move's POST).
# Under a Fischer clock, KataGo keeps it twice when the time left is less than the increment, as at a turn's second
# move on strategyjam.org (search/timecontrols.cpp). There, the time outside the search took 1.28 s at the median,
# 2.80 s at the 99th percentile and 3.16 s at most, over 461 moves. 3 s keeps 6 s at such a move: room for the slowest
# move, and for the engine client's repeat of a lost POST 3 s later. The time stays on the clock for the next turn
# (the engine repository's docs/decisions/online-play.md, "The engine's lag buffer on strategyjam.org").
lagBuffer = 3.0
