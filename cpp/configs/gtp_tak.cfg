# Tak: the settings of play through KataGo's GTP engine (`katago gtp`): the product's play, the clock matches of the
# engine repository's games/tak/docs/design/09-strength-play-and-analysis.md and the TEI front over GTP. They are Tak's
# analysis settings (analysis_tak.cfg: no root noise, the history planes as in self-play, no score utility), with the
# keys of play through GTP below. A key below wins over the included file's. The ticket of the play config, the TEI
# front and the clock match measures the search threads and the lag buffer, and changes them here.
@include analysis_tak.cfg

# GTP's logs, beside the included file's analysis_logs: each command, its response and each search. A controller can
# set logDir with -override-config.
logDir = gtp_logs
logAllGTPCommunication = true
logSearchInfo = true
logToStderr = false

# GTP needs a rules key, and the analysis settings have none. Tak's rules are the game's own (playtak's, with the swap
# opening and the 50-ply draw), so the key only satisfies the reader. The rules' komi is 0: `komi` changes it, and
# `boardsize` gives 5 or 6.
rules = tromp-taylor

# KataGo's search threads of gtp_example.cfg, for an engine on the GPU, until the clock matches measure them. The
# included file's 1 thread is the arena's, on the CPU.
numSearchThreads = 6

# No cap of visits: the clock ends each search (kata-time_settings, time_left). The included file's 500 visits are the
# arena's default. 2^50 is the largest value of KataGo's config reader, its "no limit". A controller that gives no
# clock must set maxVisits or maxTime.
maxVisits = 1125899906842624

# No search between the engine's moves, as gtp_example.cfg: in a clock match each side searches on its own time, as
# the TEI engines do under `go movetime` and a clock.
ponderingEnabled = false

# KataGo's lag buffer of gtp_example.cfg, the seconds that the clock keeps for the time outside the search.
lagBuffer = 1.0
